name: "Release & Publish VSIX"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.7.3)'
        required: true
        default: 'v1.7.3'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20

      - name: Copy License
        run: cp LICENSE extension/LICENSE.txt || true

      - name: Install Extension Dependencies
        working-directory: extension
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compile Production Extension
        working-directory: extension
        run: npm run compile

      - name: Run Test Suite
        working-directory: extension
        run: npm test && npm run test:e2e

      - name: Package VSIX
        working-directory: extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          name: "Release ${{ github.ref_name || inputs.version }}"
          tag_name: ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: extension/*.vsix
