name: Deploy Legacy Redirector to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Legacy Redirector Artifact
        run: |
          touch .github/gh-pages-redirect/.nojekyll
          cp .github/gh-pages-redirect/index.html .github/gh-pages-redirect/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/gh-pages-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
