image: node:20

stages:
  - test_and_build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - extension/node_modules/
    - docs/node_modules/

build_extension:
  stage: test_and_build
  before_script:
    - node -v
    - npm -v
    - cp LICENSE extension/LICENSE.txt || true
  script:
    - cd extension
    - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - npm run compile
    - npm run lint
    - npm test
    - npm run test:e2e
    - npx @vscode/vsce package --no-dependencies
  artifacts:
    name: "kuka-krl-extension-$CI_COMMIT_SHORT_SHA"
    paths:
      - extension/*.vsix
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"

pages:
  stage: deploy
  script:
    - cd docs
    - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - npx vitepress build
    - cd ..
    - mkdir -p public
    - if [ -d "docs/.vitepress/dist" ]; then cp -r docs/.vitepress/dist/* public/; fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
