name: Security & Spectra Assure Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  statuses: write
  actions: read

jobs:
  security-audit:
    name: Security & Supply Chain Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RL_PORTAL_ORG: ${{ secrets.RL_PORTAL_ORG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy License
        run: cp LICENSE extension/LICENSE.txt 2>/dev/null || true

      - name: Install Extension Dependencies
        working-directory: extension
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compile Production Extension
        working-directory: extension
        run: npm run compile

      - name: Static Security & i18n Symmetry Tests
        working-directory: extension
        run: npm test

      - name: Comprehensive E2E Safety Matrix
        working-directory: extension
        run: npm run test:e2e

      - name: Package VSIX
        working-directory: extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Prepare Reports Directory
        run: mkdir -p reports

      - name: ReversingLabs Spectra Assure Community Scan
        uses: reversinglabs/gh-action-rl-protect-scan@v1
        continue-on-error: true
        with:
          scan-path: "extension/package.json"
          report: "reports/spectra-assure-community-report.json"
          verbose: false
        env:
          RL_TOKEN: ${{ secrets.RL_TOKEN || secrets.RLPORTAL_ACCESS_TOKEN || secrets.RL_PORTAL_TOKEN }}

      - name: ReversingLabs Spectra Assure Enterprise Scan
        if: env.RL_PORTAL_ORG != ''
        uses: reversinglabs/gh-action-rl-scanner-cloud-composite@v1
        continue-on-error: true
        with:
          artifact-to-scan: "extension/*.vsix"
          report-path: "reports"
          rl-verbose: true
          rl-portal-server: ${{ secrets.RL_PORTAL_SERVER || 'my.secure.software' }}
          rl-portal-org: ${{ secrets.RL_PORTAL_ORG }}
          rl-portal-group: ${{ secrets.RL_PORTAL_GROUP || 'default' }}
          rl-package-url: "pkg:vscode/kuka-krl-extension@1.7.3"
        env:
          RLPORTAL_ACCESS_TOKEN: ${{ secrets.RLPORTAL_ACCESS_TOKEN || secrets.RL_PORTAL_TOKEN }}
          RL_PORTAL_TOKEN: ${{ secrets.RL_PORTAL_TOKEN || secrets.RLPORTAL_ACCESS_TOKEN }}
          RL_PORTAL_SERVER: ${{ secrets.RL_PORTAL_SERVER || 'https://my.secure.software' }}

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectra-assure-security-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
